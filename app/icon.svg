<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>LearnAI</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5bff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square brand tile, reads cleanly at 16px favicon size. -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Stylised graduation cap — symmetric diamond on top, narrow brim below. -->
  <polygon points="32,16 52,26 32,36 12,26" fill="#ffffff"/>
  <polygon points="32,36 52,26 52,30 32,40 12,30 12,26" fill="#ffffff" opacity="0.55"/>
  <!-- Tassel — a tiny accent in brand yellow keeps the mark recognisable. -->
  <path d="M44 22 L44 32" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="44" cy="34.5" r="2.5" fill="#facc15"/>
</svg>
