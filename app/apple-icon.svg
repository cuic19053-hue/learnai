<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>LearnAI</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5bff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- iOS rounds the corners itself when adding to home screen, but we
       keep a generous radius so the tile also looks correct as a regular
       PWA icon on other platforms. -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <polygon points="90,46 146,74 90,102 34,74" fill="#ffffff"/>
  <polygon points="90,102 146,74 146,84 90,112 34,84 34,74" fill="#ffffff" opacity="0.55"/>
  <path d="M124 64 L124 92" stroke="#facc15" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="124" cy="98" r="7" fill="#facc15"/>
</svg>
