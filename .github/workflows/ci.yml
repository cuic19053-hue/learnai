# LearnAI — CI for pull requests + non-main pushes
#
# Fast feedback: lint → type-check → build. No secrets, no real DB —
# build uses dummy env values just so Next.js can statically render the
# guest paths. Production deploy lives in deploy-production.yml.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Dummy values — enough for `next build` to render guest paths.
    # Real secrets live only in deploy-production.yml.
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXTAUTH_SECRET: dummy-ci-secret-not-used
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
